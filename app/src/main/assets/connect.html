<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2F3F5">
<meta name="dsh-design" content="app">
<title>连接传感器 · 心率接收</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
/* ===== 连接页 ===== */
.hero { padding: 10px 24px 0; flex-shrink: 0; }
.hero h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.hero p { margin: 8px 0 0; font-size: 14px; line-height: 1.6; color: var(--muted); max-width: 30em; }

/* 蓝牙准备条 */
.ble-state {
  display: flex; align-items: center; gap: 10px;
  margin: 18px 24px 0; padding: 12px 14px;
  border-radius: var(--radius); background: var(--surface);
  border: 1px solid var(--line); flex-shrink: 0;
}
.ble-state .ico {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; background: var(--surface-2); color: var(--text);
}
.ble-state .ico svg { width: 18px; height: 18px; }
.ble-state .txt { flex: 1; min-width: 0; }
.ble-state .t1 { font-size: 14px; font-weight: 600; }
.ble-state .t2 { font-size: 12px; color: var(--muted); margin-top: 3px; }
.ble-state.is-ready .ico { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); color: var(--ok); }

/* 扫描状态 */
.scan-row {
  display: flex; align-items: center; justify-content: space-between;
  margin: 20px 24px 4px; flex-shrink: 0;
}
.scan-row .l { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.scan-row .l .ring {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--line); border-top-color: var(--text);
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.scan-row .r { font-size: 12px; color: var(--muted); }

/* 设备列表 */
.device-list { padding: 0 24px; flex-shrink: 0; }
.device {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 14px 2px; border-top: 1px solid var(--line);
  text-align: left; position: relative;
  color: inherit; text-decoration: none;
}
.device:last-child { border-bottom: 1px solid var(--line); }
.device .avatar {
  width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
}
.device .avatar svg { width: 20px; height: 20px; }
.device .body { flex: 1; min-width: 0; }
.device .name { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
.device .meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
.device .meta .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--line-strong); }
.device .signal { display: flex; align-items: flex-end; gap: 2px; height: 14px; flex-shrink: 0; }
.device .signal i { width: 3px; border-radius: 1px; background: var(--line-strong); display: block; }
.device .signal i.on { background: var(--text); }
.device .go {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; color: var(--muted);
}
.device .go svg { width: 16px; height: 16px; }
.device:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
.device:active .avatar { background: var(--surface-2); }
.device.is-near .name { color: var(--text); }

/* 底部提示 */
.tip-block {
  margin: 18px 24px 0; padding: 14px 0 0;
  border-top: 1px solid var(--line);
  flex-shrink: 0;
}
.tip-block .h {
  display: flex; align-items: center; gap: 7px;
  font-size: 14px; font-weight: 600;
}
.tip-block .h svg { width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; }
.tip-block ol {
  margin: 8px 0 0; padding-left: 18px;
  font-size: 13px; line-height: 1.75; color: var(--muted);
}
.tip-block ol b { color: var(--text); font-weight: 600; }

.space { flex: 1; min-height: 8px; }
</style>
<script src="crash.js"></script>
</head>
<body data-level="connect">

<main class="screen is-active">
  <header class="topbar">
    <a class="icon-btn back-btn" href="#" data-back>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="topbar-mid"><div class="tb-title">连接传感器</div></div>
    <div style="width:46px"></div>
  </header>

  <section class="hero">
    <h1>找一台正在广播心率的设备</h1>
    <p>手表要先打开「心率广播」，手机这边才找得到它。</p>
  </section>

  <div class="ble-state is-ready">
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 7l10 10-5 5V2l5 5L7 17"/>
      </svg>
    </div>
    <div class="txt">
      <div class="t1">蓝牙已开启</div>
      <div class="t2">附近有 3 台设备可见</div>
    </div>
    <span class="pill is-live"><i class="dot"></i>扫描中</span>
  </div>

  <div class="scan-row">
    <div class="l"><i class="ring"></i>附近的设备</div>
    <div class="r">刷新</div>
  </div>

  <div class="device-list">
    <div class="empty-scan"><div class="t">正在搜索附近的心率设备…</div><div class="d">手表要开着「心率广播」</div></div>
  </div>

  <div class="tip-block">
    <div class="h">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 4.6-3.2 8.4-8 9.5C7.2 20.4 4 16.6 4 12V7z"/><path d="M9 12l2 2 4-4"/></svg>
      传感器那边要这样做
    </div>
    <ol>
      <li>手表或手环「全智能模式」下打开应用列表，点 <b>心率广播</b>；</li>
      <li>长续航模式下新建连接会失败，先切回全智能模式；</li>
      <li>广播开着的时候别返回关掉，找得到列表才能连上。</li>
    </ol>
  </div>

  <div class="space"></div>
</main>

<script>
/* 轻量日志：任何页面都能调 HRLog(msg, level)，存 localStorage，devlog.html 里看 */
window.HRLog = window.HRLog || function (msg, level) {
  try {
    var K = 'heart.logs';
    var list = JSON.parse(localStorage.getItem(K) || '[]');
    list.push({ t: Date.now(), msg: String(msg), level: level || '' });
    if (list.length > 1000) list = list.slice(-1000);
    localStorage.setItem(K, JSON.stringify(list));
  } catch (e) {}
};
</script>
<script src="native.js"></script>
<script src="native-hook.js"></script>
<script src="nav.js"></script>
</body>
</html>
