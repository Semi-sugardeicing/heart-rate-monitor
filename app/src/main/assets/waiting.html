<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2F3F5">
<meta name="dsh-design" content="app">
<title>等待接收 · 心率接收</title>
<script src="native.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="guide.css">
<link rel="stylesheet" href="report.css">
<style>
/* ===== 未连接：先让用户知道差什么 ===== */
.wait-head { text-align: center; padding: 16px 24px 0; flex-shrink: 0; }
.wait-head h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.wait-head p { margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); }

/* 空波形：灰线一条，中间写大字，告诉用户连上就会这样 */
.ecg-box.is-empty {
  display: flex; align-items: center; justify-content: center;
}
.ecg-box .empty-state {
  position: relative; z-index: 2; text-align: center; padding: 0 24px;
}
.ecg-box .empty-state .stroke {
  width: 84px; height: 44px; margin: 0 auto 14px; display: block;
  color: var(--line-strong);
}
.ecg-box .empty-state .t1 { font-size: 16px; font-weight: 600; color: var(--text); }
.ecg-box .empty-state .t2 { margin-top: 6px; font-size: 13px; line-height: 1.6; color: var(--muted); }

/* 检查清单 */
.checklist { margin: 20px 24px 0; flex-shrink: 0; }
.check-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
.check-row:first-child { border-top: 1px solid var(--line); }
.check-row .box {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center;
  border: 1.5px solid var(--line-strong); color: transparent;
}
.check-row .box svg { width: 13px; height: 13px; }
.check-row.is-done .box { background: var(--text); border-color: var(--text); color: var(--bg); }
.check-row .body { flex: 1; min-width: 0; }
.check-row .t { font-size: 15px; font-weight: 600; }
.check-row .d { font-size: 13px; color: var(--muted); margin-top: 3px; }
.check-row.is-done .t { color: var(--muted); font-weight: 500; }

.space { flex: 1; min-height: 12px; }
</style>
<script src="crash.js"></script>
</head>
<body>

<main class="screen is-active">
  <header class="topbar">
    <div style="width:46px"></div>
    <div class="topbar-mid">
      <div class="tb-title">心率接收</div>
      <div class="tb-pills">
        <span class="pill"><i class="dot"></i>未连接</span>
      </div>
    </div>
    <a class="icon-btn glass-btn" href="settings.html" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 13.9a7.8 7.8 0 0 0 0-3.8l2-1.5-2-3.4-2.4 1a7.8 7.8 0 0 0-3.3-1.9L13.4 2h-2.8l-.3 2.3a7.8 7.8 0 0 0-3.3 1.9l-2.4-1-2 3.4 2 1.5a7.8 7.8 0 0 0 0 3.8l-2 1.5 2 3.4 2.4-1a7.8 7.8 0 0 0 3.3 1.9l.3 2.3h2.8l.3-2.3a7.8 7.8 0 0 0 3.3-1.9l2.4 1 2-3.4z"/>
      </svg>
    </a>
  </header>

  <section class="wait-head">
    <h1>还没收到心率</h1>
    <p>先连上传感器，收到心跳后才会进入接收界面。</p>
  </section>

  <section class="ecg-wrap" style="margin-top:20px">
    <div class="ecg-box is-empty">
      <div class="empty-state">
        <svg class="stroke" viewBox="0 0 120 60" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 34h30l6-10 8 24 10-34 8 22 6-2h30"/>
        </svg>
        <div class="t1">连上手表后这里会画出波形</div>
        <div class="t2">跟医院监护仪一样的走纸，25 mm/s、10 mm/mV</div>
      </div>
    </div>
  </section>

  <section class="checklist">
    <div class="check-row is-done">
      <div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6"/></svg></div>
      <div class="body"><div class="t">手机蓝牙已打开</div><div class="d">已经在系统里授权蓝牙权限</div></div>
    </div>
    <div class="check-row">
      <div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6"/></svg></div>
      <div class="body"><div class="t">手表在「全智能模式」</div><div class="d">长续航模式下新建连接会失败</div></div>
    </div>
    <div class="check-row">
      <div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6"/></svg></div>
      <div class="body"><div class="t">手表里「心率广播」开着</div><div class="d">应用列表里点开，别返回关掉</div></div>
    </div>
  </section>

  <div class="space"></div>

  <div class="btn-row" style="padding-bottom:4px">
    <a class="cta-ghost" href="connect.html" style="flex:0 0 120px;text-decoration:none">连接传感器</a>
    <a class="cta" href="index.html" style="text-decoration:none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
      开始接收
    </a>
  </div>
</main>

<script src="guide.js"></script>
<script src="report.js"></script>
<script>Tour.auto();</script>
<script src="native-hook.js"></script>
</body>
</html>
